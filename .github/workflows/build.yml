# Build only the checked-out sources. This workflow is not run by local builds.
name: build
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # "file" is the name people see on the release page, so it says who the
        # build is for. diskseer.exe is the one almost everyone needs: 64-bit
        # Windows 10 and 11. The README download table uses the same names.
        include:
          - {edition: modern, go: '1.27.1', arch: amd64, file: 'diskseer.exe'}
          - {edition: modern, go: '1.27.1', arch: '386', file: 'diskseer-32bit.exe'}
          - {edition: modern, go: '1.27.1', arch: arm64, file: 'diskseer-arm64.exe'}
          - {edition: legacy, go: '1.20.14', arch: amd64, file: 'diskseer-windows7-8.exe'}
          - {edition: legacy, go: '1.20.14', arch: '386', file: 'diskseer-windows7-8-32bit.exe'}
    env:
      GOOS: windows
      GOARCH: ${{ matrix.arch }}
      GOAMD64: v1
      GO386: softfloat
      CGO_ENABLED: '0'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: go vet ./...
      - if: matrix.arch != 'arm64'
        run: go test ./...
      # Real shell relaunch: starts hidden cmd and PowerShell windows with a copy
      # of the test binary and waits for the child to confirm. A cold PowerShell
      # on a busy runner sometimes needed more than the program's 10-second
      # limit, so the test allows each shell 30 seconds and the step timeout
      # covers both. It runs on every pull request and every push to main, and
      # is skipped when a release is published: that commit was already
      # verified, and the release job only attaches files if every test passes,
      # so a timing hiccup would ship a release with nothing to download.
      - if: matrix.arch != 'arm64' && github.event_name != 'release'
        run: go test ./internal/terminal -run TestRealShell -count=1 -timeout=120s
        env:
          DISKSEER_LAUNCH_TESTS: '1'
      - if: matrix.arch == 'amd64' && matrix.edition == 'modern'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - if: matrix.arch == 'amd64' && matrix.edition == 'modern'
        run: |
          node --test tools/report-ui.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -File tools/test-probe.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -File tools/test-terminal-discovery.ps1
      - run: go build -trimpath -buildvcs=false -ldflags "-s -w" -o ${{ matrix.file }} .
      - uses: actions/upload-artifact@v4
        with:
          name: diskseer-${{ matrix.edition }}-${{ matrix.arch }}
          path: ${{ matrix.file }}
  release:
    if: github.event_name == 'release'
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: diskseer-*
          merge-multiple: true
          path: dist
      - run: |
          Get-ChildItem dist/*.exe | ForEach-Object { ((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower() + '  ' + $_.Name) } | Set-Content dist/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/SHA256SUMS.txt