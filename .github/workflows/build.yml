# Compila e collauda a ogni modifica, e allega il binario a ogni release.
#
# Serve a due cose: chi guarda il progetto vede subito se i test passano, e le
# release contengono un eseguibile compilato da GitHub invece che dal portatile
# di qualcuno — cosa che chiunque può verificare guardando il registro.
name: build

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o diskseer.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: diskseer-windows-amd64
          path: diskseer.exe

  release:
    if: github.event_name == 'release'
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go build -ldflags "-s -w" -o diskseer.exe .
      - uses: softprops/action-gh-release@v2
        with:
          files: diskseer.exe
